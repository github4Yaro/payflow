doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'
        types:
            order_id: App\Infrastructure\Doctrine\Type\OrderIdType
            invoice_id: App\Infrastructure\Doctrine\Type\InvoiceIdType
            invoice_series: App\Infrastructure\Doctrine\Type\InvoiceSeriesType

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            Order:
                type: xml
                dir: '%kernel.project_dir%/src/Infrastructure/Doctrine/Mapping/Order'
                prefix: 'App\Domain\Order'
                is_bundle: false
            Invoice:
                type: xml
                dir: '%kernel.project_dir%/src/Infrastructure/Doctrine/Mapping/Invoice'
                prefix: 'App\Domain\Invoice'
                is_bundle: false
            Shared:
                type: xml
                dir: '%kernel.project_dir%/src/Infrastructure/Doctrine/Mapping/Shared'
                prefix: 'App\Domain\Shared'
                is_bundle: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
